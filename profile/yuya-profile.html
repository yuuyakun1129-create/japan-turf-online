<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="ゆうやのプロフィール。Discord: @rq.nn">
  <title>ゆうや | Profile</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23090909'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='monospace' font-size='42' fill='white'%3Ey%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; color: #f5f5f5; background: #090909; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    button, input { font: inherit; }
    button, a { touch-action: manipulation; }
    button { color: inherit; cursor: pointer; }
    a { color: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid #c5a3ff; outline-offset: 5px; }
    [hidden] { display: none !important; }
    #dust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .65; }
    .ambient { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, #ffffff05, transparent 68%); }
    .stage { min-height: 100svh; display: grid; place-items: center; padding: 76px 20px; }
    .stack { position: relative; width: min(100%, 470px); }
    .glass { border: 1px solid #ffffff38; border-radius: 23px; background: #13131370; box-shadow: inset 0 0 0 1px #ffffff05, 0 12px 50px #0002; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .profile { padding: 30px 28px 20px; }
    .identity { display: flex; gap: 15px; align-items: center; min-height: 58px; flex-wrap: wrap; }
    h1 { font-size: clamp(30px, 7.5vw, 39px); line-height: 1.4; letter-spacing: -.04em; font-weight: 600; margin: 0; }
    .cursor { display: inline-block; margin-left: 4px; height: .94em; border-right: 2px solid #fff; vertical-align: -.07em; animation: blink 1s steps(1) infinite; }
    .diamond { color: #a86be1; width: 23px; height: 23px; filter: drop-shadow(0 0 9px #9854df40); flex: 0 0 auto; }
    .handle { color: #999; font-size: 14px; margin: 3px 0 0; }
    .socials { display: flex; align-items: center; justify-content: center; margin: 33px 0 31px; }
    .social { display: grid; place-items: center; width: 60px; height: 58px; background: none; border: 0; border-radius: 14px; transition: transform .2s, filter .2s; }
    .social:hover { transform: translateY(-3px); filter: drop-shadow(0 0 9px #ffffff65); }
    .social svg { width: 39px; height: 31px; }
    .meta { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #b7b7b7; }
    .meta svg { width: 15px; height: 15px; }
    .divider { width: 1px; height: 14px; background: #ffffff36; margin: 0 4px; }
    .contact { display: flex; gap: 13px; align-items: center; margin-top: 16px; padding: 16px; }
    .monogram { display: grid; place-items: center; flex: 0 0 56px; height: 56px; background: #343434; border-radius: 14px; font-size: 29px; }
    .contact-text { min-width: 0; flex: 1; }
    .contact-text strong { font-size: 18px; font-weight: 500; }
    .contact-text small { display: block; font-size: 12px; color: #969696; margin-top: 5px; }
    .copy { border: 1px solid #68d99330; border-radius: 8px; background: #20944c; padding: 12px 14px; min-height: 44px; font-size: 14px; transition: background .2s; }
    .copy:hover { background: #28aa59; }
    .note { margin: 17px 4px 0; color: #898989; font-family: system-ui, sans-serif; font-size: 12px; text-align: center; line-height: 1.8; }
    .gate { position: fixed; z-index: 5; inset: 0; display: grid; place-items: center; background: #000; transition: opacity .65s, visibility .65s; }
    .gate.dismissed { opacity: 0; visibility: hidden; pointer-events: none; }
    .enter { width: 100%; height: 100%; border: 0; background: transparent; font-size: clamp(26px, 6vw, 33px); letter-spacing: -.04em; line-height: 1.45; }
    .enter span { display: inline-block; text-align: left; }
    body.has-js .stack { opacity: 0; transform: translateY(14px); }
    body.entered .stack { opacity: 1; transform: none; transition: opacity 1s .18s, transform 1s .18s; }
    .motion { position: fixed; right: max(17px, env(safe-area-inset-right)); top: max(17px, env(safe-area-inset-top)); z-index: 2; width: 44px; height: 44px; border: 1px solid #ffffff1a; background: #14141480; border-radius: 50%; display: grid; place-items: center; color: #aaa; }
    .motion svg { width: 18px; height: 18px; }
    .toast { position: fixed; z-index: 10; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); padding: 13px 18px; background: #252525; border: 1px solid #ffffff30; border-radius: 12px; font-family: system-ui, sans-serif; font-size: 14px; text-align: center; }
    dialog { width: min(420px, calc(100% - 32px)); padding: 26px; color: #eee; background: #151515; border: 1px solid #555; border-radius: 22px; font-family: system-ui, sans-serif; }
    dialog::backdrop { background: #000b; backdrop-filter: blur(5px); }
    dialog h2 { font-size: 21px; margin: 0 40px 20px 0; }
    dialog p { font-size: 14px; color: #bcbcbc; line-height: 1.8; }
    .close { position: absolute; right: 14px; top: 12px; width: 44px; height: 44px; border: 0; background: none; font-size: 26px; }
    .username { display: flex; gap: 10px; margin: 14px 0; }
    .username input { min-width: 0; width: 100%; background: #080808; color: #fff; border: 1px solid #444; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 18px; }
    .open-discord { display: block; text-align: center; padding: 13px; border: 1px solid #555; border-radius: 10px; text-decoration: none; font-size: 14px; }
    @keyframes blink { 50% { opacity: 0; } }
    body.paused .cursor { animation: none; }
    @media (max-width: 380px) { .stage { padding-inline: 14px; } .profile { padding: 25px 22px 19px; } .contact { gap: 10px; padding: 13px; } .monogram { flex-basis: 46px; height: 46px; } .copy { padding-inline: 10px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <script>document.body.classList.add('has-js');</script>
  <canvas id="dust" aria-hidden="true"></canvas>
  <div class="ambient" aria-hidden="true"></div>
  <div id="gate" class="gate" hidden>
    <button id="enter" class="enter" type="button" aria-label="プロフィールを開く"><span>click to<br>enter...</span></button>
  </div>
  <button id="motion" class="motion" type="button" aria-label="背景アニメーションを停止" aria-pressed="false" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
  </button>
  <main class="stage" id="main">
    <div class="stack">
      <article class="profile glass" aria-label="ゆうやのプロフィール">
        <div class="identity">
          <h1 id="name" tabindex="-1" aria-label="ゆうや"><span id="typed" aria-hidden="true">ゆうや</span><span class="cursor" aria-hidden="true"></span></h1>
          <svg class="diamond" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 8 7 3h10l4 5-9 13L3 8Zm0 0h18M7 3l5 18 5-18M7 3l5 5 5-5"/></svg>
        </div>
        <p class="handle">@rq.nn</p>
        <div class="socials">
          <button class="social" id="discord" type="button" aria-label="Discordでゆうやとつながる" hidden>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.32 4.37a19.8 19.8 0 0 0-4.89-1.52l-.6 1.23a18.3 18.3 0 0 0-5.66 0l-.6-1.23a19.7 19.7 0 0 0-4.89 1.52C.59 8.95-.25 13.41.17 17.81a19.9 19.9 0 0 0 6 3.04l1.22-1.98a12.8 12.8 0 0 1-1.92-.92l.47-.37a14.1 14.1 0 0 0 12.12 0l.47.37c-.61.36-1.25.67-1.92.92l1.22 1.98a19.9 19.9 0 0 0 6-3.04c.5-5.1-.86-9.52-3.51-13.44ZM8.02 15.13c-1.18 0-2.14-1.08-2.14-2.4s.94-2.4 2.14-2.4c1.2 0 2.16 1.09 2.14 2.4 0 1.32-.94 2.4-2.14 2.4Zm7.96 0c-1.18 0-2.14-1.08-2.14-2.4s.94-2.4 2.14-2.4c1.2 0 2.16 1.09 2.14 2.4 0 1.32-.94 2.4-2.14 2.4Z"/></svg>
          </button>
          <noscript><a href="https://discord.com/channels/@me">Discordを開く</a></noscript>
        </div>
        <div class="meta"><span>YUYA</span><span class="divider" aria-hidden="true"></span><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 0 0-7-7Zm0 10a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/></svg><span>Discord</span></div>
      </article>
      <section class="contact glass" aria-label="Discordの連絡先">
        <div class="monogram" aria-hidden="true">Y</div>
        <div class="contact-text"><strong>@rq.nn</strong><small>Discord / ゆうや</small></div>
        <button class="copy" data-copy type="button" hidden>コピー</button>
      </section>
      <p class="note">フレンド追加で「rq.nn」を検索</p>
    </div>
  </main>
  <dialog id="contact-dialog" aria-labelledby="dialog-title">
    <button id="close" class="close" type="button" aria-label="閉じる">×</button>
    <h2 id="dialog-title">Discordでつながる</h2>
    <p>ユーザー名をコピーして、Discordの「フレンド追加」に貼り付けてください。</p>
    <div class="username"><input id="username" aria-label="Discordユーザー名" value="rq.nn" readonly><button class="copy" data-copy type="button">コピー</button></div>
    <a class="open-discord" href="https://discord.com/channels/@me" target="_blank" rel="noopener noreferrer">Discordを開く ↗</a>
    <p>コピーできない場合は「rq.nn」を長押しして選択できます。</p>
  </dialog>
  <p id="toast" class="toast" role="status" hidden></p>
  <script>
    (() => {
      'use strict';
      const $ = (id) => document.getElementById(id);
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      let paused = reducedMotion.matches;
      let entered = false;
      let typingTimer, toastTimer, frame;
      const main = $('main');
      main.inert = true;
      $('gate').hidden = false;
      $('discord').hidden = false;
      document.querySelectorAll('[data-copy]').forEach(button => button.hidden = false);
      $('enter').addEventListener('click', () => {
        if (entered) return;
        entered = true;
        main.inert = false;
        $('gate').classList.add('dismissed');
        document.body.classList.add('entered');
        $('motion').hidden = false;
        $('name').focus({ preventScroll: true });
        if (!paused) {
          const letters = Array.from('ゆうや');
          $('typed').textContent = '';
          let index = 0;
          const type = () => {
            $('typed').textContent += letters[index++];
            if (index < letters.length) typingTimer = setTimeout(type, 230);
          };
          typingTimer = setTimeout(type, 260);
        }
        restart();
      });
      const dialog = $('contact-dialog');
      $('discord').addEventListener('click', () => dialog.showModal());
      $('close').addEventListener('click', () => dialog.close());
      dialog.addEventListener('click', event => {
        const box = dialog.getBoundingClientRect();
        if (event.target === dialog && (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom)) dialog.close();
      });
      function notify(message) {
        clearTimeout(toastTimer);
        $('toast').textContent = message;
        $('toast').hidden = false;
        toastTimer = setTimeout(() => $('toast').hidden = true, 3500);
      }
      async function copyUsername() {
        try {
          await navigator.clipboard.writeText('rq.nn');
          notify('rq.nn をコピーしました');
        } catch {
          if (!dialog.open) dialog.showModal();
          $('username').focus();
          $('username').select();
          $('username').setSelectionRange(0, 5);
          notify('選択した rq.nn を手動でコピーしてください');
        }
      }
      document.querySelectorAll('[data-copy]').forEach(button => button.addEventListener('click', copyUsername));
      const canvas = $('dust');
      const ctx = canvas.getContext('2d');
      let width = 0, height = 0, points = [], last = 0;
      function resize() {
        width = innerWidth; height = innerHeight;
        const ratio = Math.min(devicePixelRatio || 1, 2);
        canvas.width = width * ratio; canvas.height = height * ratio;
        if (!ctx) return;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        points = Array.from({ length: Math.min(90, Math.round(width * height / 11000)) }, () => ({
          x: Math.random() * width, y: Math.random() * height,
          size: .35 + Math.random() * .75, speed: 4 + Math.random() * 12, alpha: .08 + Math.random() * .32
        }));
        draw(0);
      }
      function draw(dt) {
        if (!ctx) return;
        ctx.clearRect(0, 0, width, height);
        for (const point of points) {
          point.y -= point.speed * dt; point.x += point.speed * .16 * dt;
          if (point.y < -2) point.y = height + 2;
          if (point.x > width + 2) point.x = -2;
          ctx.fillStyle = `rgba(230,230,230,${point.alpha})`;
          ctx.beginPath(); ctx.arc(point.x, point.y, point.size, 0, Math.PI * 2); ctx.fill();
        }
      }
      function animate(time) {
        draw(last ? Math.min((time - last) / 1000, .05) : 0);
        last = time;
        frame = requestAnimationFrame(animate);
      }
      function restart() {
        cancelAnimationFrame(frame); last = 0;
        if (ctx && entered && !paused && !document.hidden) frame = requestAnimationFrame(animate);
      }
      function updateMotion() {
        document.body.classList.toggle('paused', paused);
        $('motion').setAttribute('aria-pressed', String(paused));
        $('motion').setAttribute('aria-label', paused ? '背景アニメーションを再生' : '背景アニメーションを停止');
        $('motion').querySelector('path').setAttribute('d', paused ? 'M8 5l11 7-11 7Z' : 'M9 5v14M15 5v14');
        if (paused) { clearTimeout(typingTimer); $('typed').textContent = 'ゆうや'; }
        restart();
      }
      $('motion').addEventListener('click', () => { paused = !paused; updateMotion(); });
      reducedMotion.addEventListener('change', () => { paused = reducedMotion.matches; updateMotion(); });
      addEventListener('resize', resize);
      document.addEventListener('visibilitychange', restart);
      resize(); updateMotion();
    })();
  </script>
</body>
</html>
