<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>呪王異界譚 — Sukuna Isekai</title>
<style>
:root{--red:#d3182d;--dark:#080708}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#42101a 0,#12090d 28%,#070607 62%);color:#f5eef1;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.11;background:repeating-linear-gradient(115deg,transparent 0 14px,#a91428 15px 16px,transparent 17px 34px)}.app{max-width:760px;margin:auto;padding:18px 16px 100px}.brand{display:flex;justify-content:space-between;align-items:center;margin:8px 0 22px}.brand b{letter-spacing:.18em;font-size:13px;color:#d9c9ce}.seal{width:42px;height:42px;border:1px solid #7e2633;display:grid;place-items:center;transform:rotate(45deg);box-shadow:0 0 30px #9d152b55}.seal span{transform:rotate(-45deg);color:#ef5268}.hero{padding:26px 20px;border:1px solid #492029;background:linear-gradient(145deg,#1a0d12dd,#0d0a0bdd);box-shadow:0 24px 80px #0009;position:relative;overflow:hidden}.hero:after{content:"宿儺";position:absolute;right:-10px;bottom:-35px;font-size:120px;font-weight:900;color:#e1203a0c;writing-mode:vertical-rl}.kicker{color:#e7475d;font-size:12px;letter-spacing:.24em}.hero h1{font-family:serif;font-size:clamp(34px,9vw,64px);line-height:.95;margin:10px 0}.hero p{color:#c2b6bb;line-height:1.8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#0e0b0d;border:1px solid #2e2025;padding:12px}.stat small{display:block;color:#81777b}.stat strong{font-size:18px}.chapter{margin-top:18px;padding:20px;border-left:2px solid var(--red);background:#0e0b0dcc}.chapter small{color:#d65c6d}.chapter h2{margin:5px 0 12px;font-size:22px}.story{line-height:1.9;color:#e4dce0;min-height:110px}.choices{display:grid;gap:10px;margin-top:18px}.choice,.tech{appearance:none;border:1px solid #54232c;background:#160d10;color:white;padding:15px 16px;text-align:left;font-weight:700;border-radius:2px}.choice:active,.tech:active{transform:scale(.985);background:#35121a}.techs{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:18px}.tech{border-color:#3b2b30;background:#0d0b0c}.tech span{color:#e64058;margin-right:7px}.footer{color:#6e6468;text-align:center;font-size:11px;margin-top:28px}.flash{animation:flash .42s}@keyframes flash{50%{box-shadow:0 0 90px #d3182d99;filter:contrast(1.3)}}
</style></head><body><main class="app"><div class="brand"><b>CURSED KING / ANOTHER WORLD</b><div class="seal"><span>呪</span></div></div><section class="hero"><div class="kicker">異世界転生 × 呪いの王</div><h1>呪王異界譚</h1><p>目を覚ますと、そこは魔法と魔族が支配する異世界だった。だが転生したのは勇者ではない。——呪いの王、両面宿儺だ。</p></section><div class="stats"><div class="stat"><small>呪力</small><strong>100%</strong></div><div class="stat"><small>威圧</small><strong>SSS</strong></div><div class="stat"><small>章</small><strong id="ch">01</strong></div></div><section class="chapter" id="scene"><small id="sceneNo"></small><h2 id="title"></h2><div class="story" id="story"></div></section><div class="choices" id="choices"></div><div class="techs"><button class="tech" onclick="cast('解')"><span>◆</span>解</button><button class="tech" onclick="cast('捌')"><span>◆</span>捌</button><button class="tech" onclick="cast('伏魔御廚子')"><span>領域</span>伏魔御廚子</button><button class="tech" onclick="cast('フーガ')"><span>炎</span>開「フーガ」</button></div><div class="footer">FAN-MADE INTERACTIVE STORY</div></main>
<script>
const scenes=[{t:"王の目覚め",s:"崩れた神殿。赤い月。周囲には武装した騎士たちが剣を向けている。<br><br>「動くな！ 貴様、何者だ！」<br><br>宿儺は自分の掌を眺め、口元を歪めた。",c:["ここはどこだ、と尋ねる","騎士を睨みつける","魔力と呪力の違いを確かめる"]},{t:"王都への道",s:"騎士たちは圧倒的な気配に息を呑む。遠くには巨大な城壁。その上空を飛竜が旋回していた。<br><br>この世界には『魔王』と呼ばれる存在がいるらしい。",c:["王都へ向かう","魔王について聞く","飛竜を呼び寄せる"]},{t:"魔王の使者",s:"黒い霧が道を塞ぎ、白銀の外套をまとった使者が姿を現す。<br><br>「異界より来た王よ。我が主がお会いになりたいそうです」",c:["『魔王をここへ呼べ』","使者についていく","力の差を見せつける"]},{t:"謁見",s:"巨大な玉座の間。魔族たちの視線が一斉に宿儺へ向く。玉座の主だけが笑っていた。<br><br>「面白い。貴様が異界の王か」",c:["『王を名乗るなら力を見せろ』","黙って玉座へ近づく","領域を匂わせる"]}];let idx=+(localStorage.getItem("sukunaScene")||0);function render(){let x=scenes[idx%scenes.length];title.textContent=x.t;story.innerHTML=x.s;sceneNo.textContent="CHAPTER "+String(idx+1).padStart(2,"0");ch.textContent=String(idx+1).padStart(2,"0");choices.innerHTML="";x.c.forEach((q,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=(i+1)+". "+q;b.onclick=()=>{idx=(idx+1)%scenes.length;localStorage.setItem("sukunaScene",idx);render()};choices.appendChild(b)})}function cast(n){story.innerHTML='宿儺が指を向ける。<br><br><b style="color:#ff4b64;font-size:22px">「'+n+'」</b><br><br>空気が軋み、異世界の魔力そのものが呪力に押し退けられていく。';scene.classList.add("flash");setTimeout(()=>scene.classList.remove("flash"),450)}render();
</script></body></html>
