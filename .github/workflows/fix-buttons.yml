name: Enable betting buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-buttons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch betting UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          if 'button{touch-action:manipulation' not in s:
              s=s.replace('button,input,select{font:inherit}', 'button,input,select{font:inherit}\nbutton{touch-action:manipulation;min-height:40px}\nnav button,.tabs button,.betType button,.quick button{position:relative;z-index:2;user-select:none;-webkit-tap-highlight-color:transparent}\nnav button:active,.tabs button:active,.betType button:active,.quick button:active{transform:translateY(1px);filter:brightness(.94)}')
          if '.uiToast{' not in s:
              s=s.replace('.betType button.active{background:var(--green);color:#fff;border-color:var(--green)}', '.betType button.active{background:var(--green);color:#fff;border-color:var(--green)}\n.uiToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#10251a;color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 8px 30px #0005;z-index:999;display:none;font-size:13px}.uiToast.show{display:block}')

          s=s.replace('<button class="active">単勝</button><button disabled>複勝</button><button disabled>馬連</button>', '<button class="active" data-bettype="単勝">単勝</button><button data-bettype="複勝">複勝</button><button data-bettype="馬連">馬連</button>')
          if 'id="uiToast"' not in s:
              s=s.replace('\n<script>\n', '\n<div class="uiToast" id="uiToast"></div>\n<script>\n', 1)

          s=s.replace('let horses=[],selected=null,bets=[],racing=false,timer=180,tick;', 'let horses=[],selected=null,bets=[],racing=false,timer=180,tick;\nlet tableMode="entries", betType="単勝", selectedHorses=[];')
          s=s.replace('selected=null;bets=[];racing=false;timer=180;', 'selected=null;selectedHorses=[];bets=[];racing=false;timer=180;')

          s=s.replace('const tb=document.getElementById("horseTable");tb.innerHTML="";\n  horses.forEach(h=>{', 'const tb=document.getElementById("horseTable");tb.innerHTML="";\n  let display=[...horses];\n  if(tableMode==="odds") display.sort((a,b)=>a.odds-b.odds);\n  if(tableMode==="training") display.sort((a,b)=>b.ability-a.ability);\n  if(tableMode==="past") display.sort((a,b)=>{const av=x=>x.runs.split("-").reduce((q,n)=>q+Number(n),0)/5;return av(a)-av(b)});\n  display.forEach(h=>{')
          s=s.replace('const tr=document.createElement("tr");tr.className="horseRow"+(selected===h.id?" selected":"");', 'const tr=document.createElement("tr");\n    const isSel=betType==="馬連"?selectedHorses.includes(h.id):selected===h.id;\n    tr.className="horseRow"+(isSel?" selected":"");')
          s=s.replace('tr.onclick=()=>{if(!racing){selected=h.id;render()}};', 'tr.onclick=()=>{if(racing)return;if(betType==="馬連"){if(selectedHorses.includes(h.id))selectedHorses=selectedHorses.filter(x=>x!==h.id);else if(selectedHorses.length<2)selectedHorses.push(h.id);else selectedHorses=[selectedHorses[1],h.id];}else{selected=h.id;selectedHorses=[h.id];}render()};')

          old='''  const t=document.getElementById("ticket");
  if(!selected)t.textContent="出馬表から1頭選択してください。";
  else{
    const h=horses.find(x=>x.id===selected);
    t.innerHTML=`<strong>単勝 ${h.id}番</strong><br>${h.name}<br><span class="small">現在オッズ ${h.odds.toFixed(1)}倍 / ${h.pop}番人気</span>`;
  }'''
          new='''  const t=document.getElementById("ticket");
  if(betType==="馬連"){
    if(selectedHorses.length<2)t.innerHTML=`<strong>馬連</strong><br>あと${2-selectedHorses.length}頭選択してください。`;
    else{const a=horses.find(x=>x.id===selectedHorses[0]),b=horses.find(x=>x.id===selectedHorses[1]);const o=Math.max(2.2,Math.round(a.odds*b.odds*.85*10)/10);t.innerHTML=`<strong>馬連 ${a.id}-${b.id}</strong><br>${a.name} × ${b.name}<br><span class="small">想定オッズ ${o.toFixed(1)}倍</span>`;}
  }else if(!selected)t.textContent="出馬表から1頭選択してください。";
  else{const h=horses.find(x=>x.id===selected);const o=betType==="複勝"?Math.max(1.1,Math.round((1+h.odds/4)*10)/10):h.odds;t.innerHTML=`<strong>${betType} ${h.id}番</strong><br>${h.name}<br><span class="small">現在オッズ ${o.toFixed(1)}倍 / ${h.pop}番人気</span>`;}'''
          s=s.replace(old,new)

          old='''  bets.forEach(b=>{
    const h=horses.find(x=>x.id===b.horseId);
    betsBox.innerHTML+=`<div class="historyItem"><b>単勝 ${h.id}番 ${h.name}</b><br>${fmt(b.amount)} C × ${h.odds.toFixed(1)}倍</div>`;
  });
  const stake=bets.reduce((a,b)=>a+b.amount,0);
  let potential=0;bets.forEach(b=>{const h=horses.find(x=>x.id===b.horseId);potential+=Math.floor(b.amount*h.odds)});'''
          new='''  bets.forEach(b=>{if(b.type==="馬連"){const a=horses.find(x=>x.id===b.horseIds[0]),c=horses.find(x=>x.id===b.horseIds[1]);betsBox.innerHTML+=`<div class="historyItem"><b>馬連 ${a.id}-${c.id}</b><br>${a.name} × ${c.name}<br>${fmt(b.amount)} C × ${b.odds.toFixed(1)}倍</div>`;}else{const h=horses.find(x=>x.id===b.horseId);betsBox.innerHTML+=`<div class="historyItem"><b>${b.type} ${h.id}番 ${h.name}</b><br>${fmt(b.amount)} C × ${b.odds.toFixed(1)}倍</div>`;}});
  const stake=bets.reduce((a,b)=>a+b.amount,0);
  let potential=bets.reduce((sum,b)=>sum+Math.floor(b.amount*b.odds),0);'''
          s=s.replace(old,new)

          a=s.index('document.getElementById("betBtn").onclick=()=>{')
          b=s.index('document.querySelectorAll(".quick button")',a)
          s=s[:a]+'''document.getElementById("betBtn").onclick=()=>{
  if(racing)return;
  if(betType==="馬連"&&selectedHorses.length!==2){alert("馬連は2頭選んでください");return}
  if(betType!=="馬連"&&!selected){alert("出馬表から馬を選んでください");return}
  const amt=Math.floor(Number(document.getElementById("betAmount").value));
  if(!Number.isFinite(amt)||amt<100){alert("100 C以上で入力してください");return}
  if(amt>coins){alert("所持コインが足りません");return}
  let ticket;
  if(betType==="馬連"){const x=horses.find(h=>h.id===selectedHorses[0]),y=horses.find(h=>h.id===selectedHorses[1]);const odds=Math.max(2.2,Math.round(x.odds*y.odds*.85*10)/10);ticket={type:"馬連",horseIds:[x.id,y.id],amount:amt,odds};}
  else{const h=horses.find(x=>x.id===selected);const odds=betType==="複勝"?Math.max(1.1,Math.round((1+h.odds/4)*10)/10):h.odds;ticket={type:betType,horseId:h.id,amount:amt,odds};}
  coins-=amt;dailyPnl-=amt;bets.push(ticket);save();render();showToast(betType+"を購入しました");
}
'''+s[b:]

          s=s.replace('let payout=0;bets.forEach(b=>{if(b.horseId===winner.id)payout+=Math.floor(b.amount*winner.odds)});', 'let payout=0;const top3ids=top3.map(h=>h.id),top2=new Set(top3ids.slice(0,2));bets.forEach(b=>{let hit=b.type==="単勝"?b.horseId===winner.id:b.type==="複勝"?top3ids.includes(b.horseId):top2.has(b.horseIds[0])&&top2.has(b.horseIds[1]);if(hit)payout+=Math.floor(b.amount*b.odds)});')

          hook='''
function showToast(msg){const el=document.getElementById("uiToast");el.textContent=msg;el.classList.add("show");clearTimeout(showToast._t);showToast._t=setTimeout(()=>el.classList.remove("show"),1600)}
function setActiveButtons(g,c){g.forEach(b=>b.classList.toggle("active",b===c))}
const innerTabs=[...document.querySelectorAll(".tabs button")];innerTabs.forEach((btn,i)=>btn.addEventListener("click",()=>{setActiveButtons(innerTabs,btn);tableMode=["entries","odds","training","past"][i];render();showToast(btn.textContent+"を表示")}));
const navBtns=[...document.querySelectorAll("nav button")];navBtns.forEach((btn,i)=>btn.addEventListener("click",()=>{setActiveButtons(navBtns,btn);if(i===0)document.querySelector(".resultArea").scrollIntoView({behavior:"smooth"});if(i===1){tableMode="entries";render();document.querySelector(".tableWrap").scrollIntoView({behavior:"smooth"})}if(i===2){tableMode="odds";render();document.querySelector(".tableWrap").scrollIntoView({behavior:"smooth"})}if(i===3)document.getElementById("history").scrollIntoView({behavior:"smooth"});if(i===4){tableMode="training";render();document.querySelector(".tableWrap").scrollIntoView({behavior:"smooth"})}}));
const betTypeBtns=[...document.querySelectorAll(".betType button")];betTypeBtns.forEach(btn=>btn.addEventListener("click",()=>{betType=btn.dataset.bettype;setActiveButtons(betTypeBtns,btn);if(betType==="馬連"){selected=null;selectedHorses=[]}else selectedHorses=selected?[selected]:[];render();showToast(betType+"に切り替えました")}));
'''
          if 'const betTypeBtns=' not in s:
              s=s.replace('\ncreateRace();\n</script>',hook+'\ncreateRace();\n</script>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable win place and quinella betting" || exit 0
          git push
