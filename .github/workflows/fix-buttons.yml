name: Enable betting buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-buttons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch betting UI
        run: python patch_betting.py
      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable win place and quinella betting" || exit 0
          git push
